<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blooming Flower</title>
  <style>
    body {
      background: #0d0006;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #ffb3c1;
    }

    .container {
      text-align: center;
      position: relative;
    }

    /* Glassmorphism Card for Intro */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 182, 193, 0.2);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(255, 77, 109, 0.2);
    }

    .bloom-btn {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      border: none;
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      transition: 0.3s;
    }
    .bloom-btn:hover { transform: scale(1.05); }

    /* Flower CSS */
    .flower {
      position: relative;
      width: 200px;
      height: 280px;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }

    .stem {
      width: 8px;
      height: 0;
      background: #38b000;
      border-radius: 4px;
      transition: height 2s ease-in-out;
      box-shadow: 0 0 10px rgba(56, 176, 0, 0.5);
    }

    .petal-wrapper {
      position: absolute;
      top: 30px;
      width: 100%;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .petal {
      position: absolute;
      width: 45px;
      height: 90px;
      background: radial-gradient(circle, #ff758f 0%, #c9184a 100%);
      border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
      transform-origin: bottom center;
      opacity: 0;
      transform: scale(0.1) rotate(0deg);
      transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 20px rgba(201, 24, 74, 0.8);
    }

    .message {
      margin-top: 30px;
      font-size: 1.3rem;
      opacity: 0;
      transition: opacity 1.5s ease;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card" id="card">
      <h2 style="margin-bottom:20px;">🌹 Love.css</h2>
      <button class="bloom-btn" onclick="startBloom()">TAP TO BLOOM</button>
    </div>

    <div class="flower" id="flower">
      <div class="stem" id="stem"></div>
      <div class="petal-wrapper" id="petalWrapper"></div>
    </div>

    <div class="message" id="msg">I coded this for you ❤️</div>
  </div>

  <script>
    function startBloom() {
      document.getElementById('card').style.display = 'none';
      const flower = document.getElementById('flower');
      const stem = document.getElementById('stem');
      const petalWrapper = document.getElementById('petalWrapper');
      
      flower.style.display = 'flex';
      
      // النمو للإنبات (Stem)
      setTimeout(() => { stem.style.height = '180px'; }, 100);

      // تفتح البتلات (Petals Bloom)
      setTimeout(() => {
        const totalPetals = 12;
        for (let i = 0; i < totalPetals; i++) {
          const petal = document.createElement('div');
          petal.className = 'petal';
          const angle = (360 / totalPetals) * i;
          petalWrapper.appendChild(petal);

          setTimeout(() => {
            petal.style.opacity = '1';
            petal.style.transform = `rotate(${angle}deg) translateY(-35px) scale(1)`;
          }, i * 100);
        }
      }, 2000);

      // ظهور النص النهائي
      setTimeout(() => {
        document.getElementById('msg').style.opacity = '1';
      }, 3500);
    }
  </script>
</body>
</html>
