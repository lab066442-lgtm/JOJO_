<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f7d9e8">
  <title>JOJO KITTY — DREAMY ISLAND</title>
  <link rel="stylesheet" href="/src/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="game"></div>

  <div id="loading">
    <div class="loading-card">
      <div class="logo">JOJO KITTY</div>
      <div class="subtitle">DREAMY ISLAND</div>
      <div class="loader"><span id="loadBar"></span></div>
      <div id="loadText">Preparing your island…</div>
    </div>
  </div>

  <div id="hud">
    <div class="topbar glass">
      <div class="brand"><span class="brand-dot"></span> DREAMY ISLAND</div>
      <button id="menuBtn" class="icon-btn">☰</button>
      <div class="coins">♡ <span id="coinText">50</span></div>
    </div>

    <div id="locationLabel" class="location glass">CITY CENTER</div>

    <div id="actionBar" class="action-bar glass">
      <button data-action="map">MAP</button>
      <button data-action="quest">QUEST</button>
      <button data-action="bag">BAG</button>
      <button data-action="build">BUILD</button>
      <button data-action="camera">CAM</button>
    </div>

    <div id="questPanel" class="panel glass hidden">
      <div class="panel-head"><b>QUESTS</b><button class="close">×</button></div>
      <div id="questList"></div>
    </div>

    <div id="buildPanel" class="panel glass hidden">
      <div class="panel-head"><b>BUILD RESTAURANT</b><button class="close">×</button></div>
      <div class="build-hint">Stand on the restaurant plot, then purchase the next construction stage.</div>
      <div id="buildList"></div>
    </div>

    <div id="menuPanel" class="panel glass hidden">
      <div class="panel-head"><b>ISLAND MENU</b><button class="close">×</button></div>
      <button class="menu-item" data-menu="map">🗺️ Map</button>
      <button class="menu-item" data-menu="quest">📜 Quests</button>
      <button class="menu-item" data-menu="build">🏗️ Restaurant Build</button>
      <button class="menu-item" data-menu="settings">⚙️ Settings</button>
      <div id="settings" class="settings hidden">
        <label>Manual Quality <select id="quality">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select></label>
        <button id="saveBtn" class="wide-btn">SAVE NOW</button>
        <button id="resetBtn" class="wide-btn danger">NEW SAVE</button>
      </div>
    </div>

    <div id="toast"></div>
    <div id="debug" class="debug hidden"></div>
  </div>

  <div id="mobileControls">
    <div id="joystick"><div id="stick"></div></div>
    <div class="camera-buttons">
      <button id="camLeft">↶</button>
      <button id="camRight">↷</button>
      <button id="camUp">↑</button>
      <button id="camDown">↓</button>
    </div>
    <button id="interactBtn" class="interact">INTERACT</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
