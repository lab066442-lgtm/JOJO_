<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jojo - لعبة تجنب النجوم</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(#0f172a, #111827);
      color: white;
      font-family: Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .panel {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .scoreboard {
      font-size: 18px;
      margin-bottom: 12px;
    }

    button {
      background: linear-gradient(#22c55e, #16a34a);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
    }

    button:hover {
      background: linear-gradient(#16a34a, #15803d);
    }

    canvas {
      background: linear-gradient(#0b1020, #111827);
      border: 4px solid #38bdf8;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Jojo - لعبة تجنب النجوم</h1>
    <div class="scoreboard">
      النتيجة: <span id="score">0</span> &nbsp; | &nbsp; الأعلى: <span id="best">0</span>
    </div>
    <button id="startBtn">ابدأ اللعبة</button>
  </div>

  <canvas id="gameCanvas" width="420" height="560"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const startBtn = document.getElementById("startBtn");

    let score = 0;
    let best = Number(localStorage.getItem("jojoBest")) || 0;
    bestEl.textContent = best;

    const player = {
      x: canvas.width / 2 - 30,
      y: canvas.height - 60,
      width: 60,
      height: 26,
      speed: 7
    };

    let obstacles = [];
    let gameLoop;
    let playing = false;
    let lastTime = 0;
    let spawnTimer = 0;

    const keys = {
      left: false,
      right: false
    };

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (key === "arrowleft" || key === "a") keys.left = true;
      if (key === "arrowright" || key === "d") keys.right = true;
    });

    document.addEventListener("keyup", (e) => {
      const key = e.key.toLowerCase();
      if (key === "arrowleft" || key === "a") keys.left = false;
      if (key === "arrowright" || key === "d") keys.right = false;
    });

    function resetGame() {
      score = 0;
      scoreEl.textContent = score;
      obstacles = [];
      player.x = canvas.width / 2 - player.width / 2;
      lastTime = 0;
      spawnTimer = 0;
      playing = true;
      startBtn.textContent = "إعادة اللعب";
    }

    function update(delta) {
      if (!playing) return;

      if (keys.left) player.x -= player.speed;
      if (keys.right) player.x += player.speed;

      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

      spawnTimer += delta;
      if (spawnTimer > 700) {
        const size = 18 + Math.random() * 24;
        const x = Math.random() * (canvas.width - size);
        obstacles.push({
          x,
          y: -size,
          width: size,
          height: size,
          speed: 3 + Math.random() * 2.5
        });
        spawnTimer = 0;
      }

      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        obs.y += obs.speed;

        if (
          player.x < obs.x + obs.width &&
          player.x + player.width > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          endGame();
          return;
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        if (obstacles[i].y > canvas.height) {
          obstacles.splice(i, 1);
          score += 1;
          scoreEl.textContent = score;
        }
      }

      if (score > best) {
        best = score;
        localStorage.setItem("jojoBest", best);
        bestEl.textContent = best;
      }
    }

    function drawPlayer() {
      const px = player.x;
      const py = player.y;

      // جسم Jojo
      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(px, py, player.width, player.height);

      // وجه Jojo
      ctx.fillStyle = "#fef3c7";
      ctx.fillRect(px + 8, py - 18, player.width - 16, 18);

      // عينان
      ctx.fillStyle = "#111827";
      ctx.fillRect(px + 16, py - 12, 6, 6);
      ctx.fillRect(px + player.width - 22, py - 12, 6, 6);

      // اسم Jojo
      ctx.fillStyle = "#111827";
      ctx.font = "bold 12px Tahoma";
      ctx.textAlign = "center";
      ctx.fillText("Jojo", px + player.width / 2, py + 16);
    }

    function drawObstacles() {
      obstacles.forEach((obs) => {
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(obs.x + obs.width / 2, obs.y + obs.height / 2, obs.width / 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.beginPath();
        ctx.arc(obs.x + obs.width * 0.35, obs.y + obs.height * 0.35, obs.width * 0.12, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // نجوم خلفية
      for (let i = 0; i < 30; i++) {
        const x = (i * 73) % canvas.width;
        const y = ((i * 47) + (score * 2)) % canvas.height;
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.fillRect(x, y, 2, 2);
      }
    }

    function gameFrame(timestamp) {
      const delta = timestamp - lastTime || 16;
      lastTime = timestamp;

      drawBackground();
      update(delta);
      drawPlayer();
      drawObstacles();

      if (playing) {
        requestAnimationFrame(gameFrame);
      } else {
        drawGameOver();
      }
    }

    function endGame() {
      playing = false;
      drawGameOver();
    }

    function drawGameOver() {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "white";
      ctx.font = "bold 34px Tahoma";
      ctx.textAlign = "center";
      ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 20);

      ctx.font = "22px Tahoma";
      ctx.fillText("Jojo النتيجة: " + score, canvas.width / 2, canvas.height / 2 + 25);
    }

    startBtn.addEventListener("click", () => {
      resetGame();
      requestAnimationFrame(gameFrame);
    });
  </script>
</body>
</html>
